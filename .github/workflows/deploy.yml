name: Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  # Job 1: Run Full Test Suites (Fail Loudly if any test fails)
  test:
    name: Run Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Backend Testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

      # Frontend Testing
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npm run test

  # Job 2: Build Images, Push to ACR, and Deploy via Terraform
  deploy:
    name: Build, Push, and Deploy
    needs: test
    # Deploy only on pushes to main — dev pushes and pull_request runs are
    # tests only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Production environment gate.
    #
    # SETUP REQUIRED: this only blocks deployments once the "production"
    # environment exists in GitHub repo settings WITH required reviewers:
    #   Settings -> Environments -> New environment -> name it "production"
    #   -> enable "Required reviewers" and add the approver(s).
    # Until reviewers are configured, this line only labels the job as
    # "production" in the UI; pushes to main still deploy automatically.
    # Optionally also set a "Wait timer" and restrict deployment branches
    # to main under the same environment settings.
    # environment: production  # Uncomment after creating "production" environment in repo settings
    # Shared env for all Terraform steps — avoids repeating the same
    # TF_VAR_* and ARM_* secrets across init, validate, plan, and apply.
    env:
      # Authenticate to the Terraform state backend (Azure Storage) via OIDC
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Inject secrets as Terraform variables (TF_VAR_ prefix)
      TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
      TF_VAR_acr_name: ${{ secrets.ACR_NAME }}
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_frontend_image_tag: ${{ github.sha }}
      TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
      TF_VAR_recoveryhub_ai_mongodb_db_name: AI_FEE_CALC_MULTI_AGENT_PROD
      TF_VAR_azure_sql_host: ${{ secrets.AZURE_SQL_HOST }}
      TF_VAR_azure_sql_db: ${{ secrets.AZURE_SQL_DB }}
      TF_VAR_azure_sql_user: ${{ secrets.AZURE_SQL_USER }}
      TF_VAR_azure_sql_password: ${{ secrets.AZURE_SQL_PASSWORD }}
      TF_VAR_azure_sql_authentication: azure-ad
      TF_VAR_azure_sql_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      # SPA client ID (single source of truth): the frontend build arg
      # VITE_AZURE_CLIENT_ID and the backend's AZURE_CLIENT_ID (JWT
      # audience) both derive from this secret.
      TF_VAR_azure_spa_client_id: ${{ secrets['AZURE_SPA_CLIENT_ID'] }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Billing integration secrets (rh-dashboard-billing service principal,
      # Cost Management Reader on the Streamline Production subscription).
      TF_VAR_azure_billing_client_id: ${{ secrets['AZURE_BILLING_CLIENT_ID'] }}
      TF_VAR_azure_billing_client_secret: ${{ secrets['AZURE_BILLING_CLIENT_SECRET'] }}
      TF_VAR_azure_billing_account_id: ${{ secrets['AZURE_BILLING_ACCOUNT_ID'] }}
      TF_VAR_azure_billing_account_type: ${{ secrets['AZURE_BILLING_ACCOUNT_TYPE'] }}
      # AI integration secrets are intentionally not referenced here: those
      # GitHub secrets do not exist yet, so the Terraform defaults (empty =
      # not configured) apply. Create them and re-add the TF_VAR_openai /
      # TF_VAR_azure_openai lines here when the AI provider is configured.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Login to Azure using OIDC federated identity (no long-lived client secret).
      # Requires `permissions: id-token: write` (set at the top of this file) and
      # a federated credential on the Azure AD App Registration trusting this repo.
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry (ACR)
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # Build and Push Backend Docker Image
      - name: Build & Push Backend Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-backend:${{ github.sha }} \
            ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-backend:${{ github.sha }}

      # Build and Push Frontend Docker Image (injecting Entra client IDs)
      # The frontend client ID is a PUBLIC value (baked into browser-visible JS,
      # visible to every site visitor). It is the Entra ID SPA app registration
      # used for MSAL user login — separate from the deploy service principal.
      # It is sourced from the AZURE_SPA_CLIENT_ID GitHub secret so there is a
      # single source of truth shared with the backend's JWT audience (via
      # TF_VAR_azure_spa_client_id below).
      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_AZURE_CLIENT_ID=${{ secrets['AZURE_SPA_CLIENT_ID'] }} \
            --build-arg VITE_AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rh-dashboard-frontend:${{ github.sha }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.6.2

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      # Validate Terraform configuration (catches syntax/type errors before apply)
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      # Plan and Apply — the plan is saved to a file so apply uses the exact
      # same plan that was generated (no race with concurrent state changes).
      # `terraform plan -out` still prints the human-readable plan to the job
      # log, so the intended changes remain reviewable. -no-color keeps the
      # log free of ANSI escape codes.
      - name: Terraform Plan & Apply
        run: |
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan
        working-directory: terraform

      # A saved plan file embeds every variable value passed to Terraform —
      # including all TF_VAR_* secrets — in plaintext. Remove it regardless of
      # whether the apply succeeded so it can never be picked up by a later
      # step or artifact upload.
      - name: Remove Terraform plan file
        if: always()
        run: rm -f tfplan
        working-directory: terraform
